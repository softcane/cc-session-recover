name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Smoke packaged CLI
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          target_dir="$(mktemp -d)"
          npm pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -name 'cc-session-recover-*.tgz' -print -quit)"
          npx -y --package "$tarball" cc-session-recover init "$target_dir"
          test -f "$target_dir/.claude/settings.local.json"
          test ! -d "$target_dir/scripts"
